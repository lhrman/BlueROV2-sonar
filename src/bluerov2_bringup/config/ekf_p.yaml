ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true          # robot se giba u 2D (x, y, yaw) — z drži depth hold

    odom_frame: odom
    base_link_frame: base_link
    world_frame: map         # EKF radi u odom frameu, slam_toolbox publishe map->odom
    publish_tf: true          # EKF publishe TF: odom -> base_link
  

    # -------------------------------------------------------------------------
    # IMU — jedini izvor između dva scana
    # Daje: orijentaciju (roll, pitch, yaw) + yaw_rate + linearnu akceleraciju
    # -------------------------------------------------------------------------
    imu0: /imu/data
    imu0_config: [false, false, false,   # x, y, z pozicija — NE
                  true,  true,  true,    # roll, pitch, yaw — DA (apsolutno)
                  false, false, false,   # vx, vy, vz — NE
                  false, false, true,    # roll_rate, pitch_rate, yaw_rate — samo yaw
                  true,  true,  false]   # ax, ay, az — DA za x,y; NE za z (depth hold)

    imu0_differential: false              # koristimo apsolutne kutove s IMU-a
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true  # OBAVEZNO — inače g ulazi u ax,ay
