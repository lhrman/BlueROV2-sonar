# This is the complete pid.yaml file for 25% max speed

depth_controller:
  ros__parameters:
    kp: 150.0  
    ki: 5.0
    kd: 10.0  

yaw_controller:
  ros__parameters:
    kp: 150.0 
    kd: 7.0 

input_controller:
  ros__parameters:
    gain_yaw: 60.0 
    max_rise: 10.0
    # This is the speed for MANUAL joystick control
    move_pwm_range: 100.0

position_controller:
  ros__parameters:
    # This is the speed for AUTO position-hold mode
    # We'll set it to 100.0 to match your manual speed.
    move_pwm_range: 100.0 
    
    # --- Start with reasonable gains ---
    kp_x: 100.0
    ki_x: 0.0
    kd_x: 0.0
    
    kp_y: 100.0
    ki_y: 0.0
    kd_y: 0.0